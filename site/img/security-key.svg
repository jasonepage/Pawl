<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="t d">
  <title id="t">A USB-C security key</title>
  <desc id="d">A simple flat drawing of a green security key: a USB-C plug on the left, a round touch button in the middle, and a small hole for a keyring on the right.</desc>
  <rect width="640" height="240" rx="24" fill="#e6efdc"/>
  <!-- plug -->
  <rect x="86" y="96" width="92" height="48" rx="24" fill="#c9ddb4"/>
  <rect x="104" y="112" width="56" height="16" rx="8" fill="#2c550d"/>
  <!-- body -->
  <rect x="170" y="78" width="376" height="84" rx="36" fill="#3c6a14"/>
  <!-- touch button -->
  <circle cx="336" cy="120" r="24" fill="#e6efdc"/>
  <circle cx="336" cy="120" r="9" fill="#3c6a14"/>
  <!-- keyring hole -->
  <circle cx="496" cy="120" r="12" fill="#e6efdc"/>
</svg>
