<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t d">
  <title id="t">A USB-C security key</title>
  <desc id="d">A small green security key with a USB-C plug on the left, a round touch button in the middle, and a loop for a keyring on the right.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c7f1c"/>
      <stop offset="1" stop-color="#2c550d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6efdc"/>
      <stop offset=".5" stop-color="#c9ddb4"/>
      <stop offset="1" stop-color="#9fb98a"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="330" cy="222" rx="250" ry="14" fill="#16300a" opacity=".12"/>
  <!-- USB-C plug -->
  <rect x="40" y="108" width="96" height="44" rx="20" fill="url(#metal)"/>
  <rect x="58" y="122" width="62" height="16" rx="8" fill="#2c550d" opacity=".55"/>
  <!-- body -->
  <rect x="126" y="86" width="350" height="88" rx="30" fill="url(#body)"/>
  <rect x="126" y="86" width="350" height="88" rx="30" fill="none" stroke="#16300a" stroke-width="3" opacity=".35"/>
  <!-- touch button -->
  <circle cx="300" cy="130" r="28" fill="#3b6914" stroke="#e6efdc" stroke-width="4"/>
  <circle cx="300" cy="130" r="10" fill="#e6efdc"/>
  <!-- keyring hole -->
  <circle cx="440" cy="130" r="14" fill="#f7f8f3"/>
  <circle cx="440" cy="130" r="14" fill="none" stroke="#16300a" stroke-width="3" opacity=".35"/>
  <!-- ring -->
  <circle cx="530" cy="130" r="62" fill="none" stroke="#5b6653" stroke-width="10"/>
  <circle cx="530" cy="130" r="62" fill="none" stroke="#9fb98a" stroke-width="3"/>
  <!-- ring passes through hole -->
  <path d="M468 130 a62 62 0 0 1 12 -36" fill="none" stroke="#5b6653" stroke-width="10"/>
</svg>
